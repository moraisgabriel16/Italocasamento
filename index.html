<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Benete.inc v6</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08081a;--bg2:#11112e;--bg3:#0a0a1e;--bd:#2a2a5a;--tx:#dde0ff;--ac:#8888ff;--gn:#33cc66;--rd:#cc3344;--yw:#ffaa33;--pu:#aa33ff;--cy:#33bbcc;--pk:#ff88cc}
html,body{height:100%;background:var(--bg);font-family:'Press Start 2P',monospace;color:var(--tx);user-select:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd)}
#wrap{max-width:960px;margin:0 auto;padding:8px}
/* TOPBAR */
.topbar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:6px}
.rc{background:var(--bg2);border:2px solid var(--bd);padding:5px 3px;text-align:center}
.rl{color:#4a4a8a;font-size:5px;margin-bottom:1px}
.rv{color:#eef;font-size:8px;font-weight:bold;word-break:break-all}
.rr{color:var(--gn);font-size:4px;margin-top:1px}
/* LAYOUT: 3 col desktop, 1 col mobile */
.layout{display:grid;grid-template-columns:160px 1fr 160px;gap:6px}
@media(max-width:680px){
  .layout{grid-template-columns:1fr}
  .topbar{grid-template-columns:repeat(3,1fr)}
  .topbar .rc:nth-child(4),.topbar .rc:nth-child(5){display:none}
}
.panel{background:var(--bg2);border:2px solid var(--bd);padding:6px;margin-bottom:0}
.ptitle{color:var(--ac);font-size:6px;margin-bottom:5px;border-bottom:1px solid var(--bd);padding-bottom:3px}
.sr{display:flex;justify-content:space-between;background:var(--bg3);padding:3px 5px;border-left:2px solid var(--bd);font-size:5px;margin-bottom:2px}
.sr span:last-child{color:var(--ac)}
/* SHOP */
.scroll{overflow-y:auto;max-height:260px}
.upg{width:100%;background:var(--bg3);border:2px solid var(--bd);color:var(--tx);font-family:'Press Start 2P',monospace;font-size:5px;padding:5px;cursor:pointer;margin-bottom:3px;text-align:left;line-height:1.8;display:block;-webkit-appearance:none}
.upg:active:not(:disabled){background:#1a1a3a;border-color:#5555bb}
.upg:disabled{opacity:0.28;cursor:not-allowed}
.upg.owned{border-color:var(--gn);opacity:0.65}
.upg.cat-auto{border-left:3px solid var(--cy)}
.upg.cat-dev{border-left:3px solid var(--pk)}
.upg.cat-infra{border-left:3px solid var(--yw)}
.upg.cat-biz{border-left:3px solid var(--pu)}
.upg.cat-prod{border-left:3px solid var(--gn)}
.un{color:#aaaaee;font-size:6px;display:block}
.ud{color:#404060;font-size:5px;display:block}
.uc{color:var(--yw);font-size:5px;display:block}
/* PROGRESS */
.pbar-o{background:var(--bg3);border:2px solid var(--bd);height:10px;width:100%;margin-bottom:3px}
.pbar-i{height:100%;background:linear-gradient(90deg,#4422ff,#9922ff);transition:width 0.5s}
.pbtn{background:var(--yw);border:none;color:var(--bg);font-family:'Press Start 2P',monospace;font-size:5px;padding:5px;cursor:pointer;width:100%;margin-top:3px;-webkit-appearance:none}
.pbtn:active:not(:disabled){background:#ffcc55}
.pbtn:disabled{opacity:0.35;cursor:not-allowed;background:#555}
/* TABS */
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:5px;gap:0}
.tab{background:none;border:none;font-family:'Press Start 2P',monospace;font-size:5px;color:#445;padding:4px 5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;-webkit-appearance:none}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
/* BOOST */
.boost-bar{background:#0d1a0d;border:2px solid var(--gn);padding:4px;margin-bottom:5px}
.bfill{height:5px;background:var(--gn);transition:width 0.3s}
/* LOG */
.log-a{background:var(--bg3);border:2px solid var(--bd);padding:5px;max-height:80px;overflow-y:auto;margin-top:6px}
.lm{font-size:5px;padding:1px 0;border-bottom:1px solid #111130;color:#445588}
.lm.g{color:var(--gn)}.lm.b{color:var(--rd)}.lm.w{color:var(--yw)}.lm.p{color:var(--pu)}.lm.i{color:#3388cc}
/* NOTIFS */
#notifs{position:fixed;top:8px;right:8px;width:170px;z-index:9999;pointer-events:none}
.notif{background:#1a1a3a;border:2px solid #5533ff;padding:5px 7px;font-size:5px;margin-bottom:3px;color:#ccccff;animation:nin 0.3s,nout 0.4s 2.6s forwards}
.notif.ach{border-color:var(--yw);color:#ffdd66}
.notif.boost{border-color:var(--gn);color:#66ffaa}
.notif.tech{border-color:var(--pu);color:#cc88ff}
.notif.rival{border-color:var(--rd);color:#ff8888}
.notif.mission{border-color:var(--cy);color:#88eeff}
.notif.ipo{border-color:#ffdd00;color:#ffff88}
@keyframes nin{from{opacity:0;transform:translateX(15px)}to{opacity:1;transform:translateX(0)}}
@keyframes nout{to{opacity:0;transform:translateX(15px)}}
/* FLOAT */
.float{position:absolute;pointer-events:none;font-size:8px;color:#ffff44;animation:fup 1s ease-out forwards;font-weight:bold;z-index:50;white-space:nowrap}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-45px)}}
.cw{position:relative;display:inline-block}
.coffbar{background:var(--bg3);border:1px solid #884400;height:7px;width:100%;margin-top:2px}
.coffill{height:100%;background:#cc7722;transition:width 0.3s}
.abadge{font-size:11px;padding:2px;opacity:0.25;filter:grayscale(1);display:inline-block;margin:1px;cursor:default}
.abadge.done{opacity:1;filter:none}
/* MINI EVENT */
.me-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:10px}
.me-box{background:var(--bg2);border:3px solid var(--yw);padding:14px;width:100%;max-width:300px;text-align:center}
.me-t{color:var(--yw);font-size:8px;margin-bottom:5px;line-height:1.5}
.me-ctx{font-size:5px;color:var(--cy);margin-bottom:5px;padding:3px 5px;border:1px solid var(--cy);display:inline-block}
.me-d{color:#9999cc;font-size:5px;line-height:2;margin-bottom:8px}
.me-timer{font-size:7px;margin-bottom:6px}
.me-btn{font-family:'Press Start 2P',monospace;font-size:5px;padding:6px;cursor:pointer;border:2px solid;margin:0 0 4px;background:none;display:block;width:100%;text-align:left;-webkit-appearance:none}
.me-btn.a{border-color:var(--gn);color:var(--gn)}
.me-btn.b{border-color:#cc5533;color:#cc5533}
.me-btn.c{border-color:#5533ff;color:#8888ff}
.me-btn.d{border-color:var(--yw);color:var(--yw)}
/* TECH */
.tech-branch{margin-bottom:8px}
.branch-title{font-size:6px;margin-bottom:4px;padding-left:4px;border-left:2px solid}
.tech-node{display:flex;align-items:flex-start;gap:5px;background:var(--bg3);border:2px solid var(--bd);padding:5px;margin-bottom:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tech-node.researched{border-color:var(--gn);opacity:0.7;cursor:default}
.tech-node.locked{opacity:0.28;cursor:not-allowed}
.tech-connector{width:2px;height:8px;background:var(--bd);margin-left:11px}
/* DEV */
.dev-card{background:var(--bg3);border:2px solid var(--bd);padding:5px;margin-bottom:3px;display:flex;gap:5px}
.dev-av{width:26px;height:26px;border:2px solid #3a3a6a;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.dev-av.jr{border-color:#5555aa}.dev-av.pl{border-color:var(--gn)}.dev-av.sr{border-color:var(--yw)}.dev-av.sp{border-color:var(--pk)}
.rank-badge{font-size:4px;padding:1px 3px;display:inline-block;margin-right:2px}
.rank-jr{background:#222244;color:#8888cc}.rank-pl{background:#1a3a1a;color:var(--gn)}.rank-sr{background:#3a2a00;color:var(--yw)}.rank-sp{background:#3a001a;color:var(--pk)}
/* PROD */
.prod-c{background:var(--bg3);border:1px solid var(--bd);padding:5px;margin-bottom:3px}
.pmet{background:var(--bg2);border:1px solid var(--bd);height:5px;margin:2px 0}
.pfill{height:100%;background:#4455ff;transition:width 0.5s}
/* STATUS */
.status-bar{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.stag{font-size:5px;padding:2px 4px}
.stag.pos{background:#0d2a0d;border:1px solid var(--gn);color:var(--gn)}
.stag.neg{background:#2a0d0d;border:1px solid var(--rd);color:var(--rd)}
/* MILESTONE */
.milestone{background:#1a1a0a;border:2px solid var(--yw);padding:5px;margin-bottom:5px;font-size:5px;color:var(--yw);text-align:center;animation:milo 0.4s ease-out}
@keyframes milo{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
/* AUTO LEVELS */
.autolvl{display:flex;gap:2px;margin:2px 0;justify-content:center}
.alvl{width:16px;height:7px;background:var(--bg3);border:1px solid var(--bd);font-size:4px;display:flex;align-items:center;justify-content:center;color:#444466}
.alvl.on{background:#0d2a2a;border-color:var(--cy);color:var(--cy)}
/* MISSIONS */
.mission-card{background:var(--bg3);border:2px solid var(--bd);padding:6px;margin-bottom:4px}
.mission-card.done{border-color:var(--gn)}
.mission-title{color:#aaaaee;font-size:6px;margin-bottom:3px}
.mission-desc{color:#404060;font-size:5px;margin-bottom:3px}
.mission-prog{background:var(--bg2);border:1px solid var(--bd);height:6px;margin-bottom:3px}
.mission-fill{height:100%;background:var(--ac);transition:width 0.5s}
.mission-reward{color:var(--yw);font-size:5px}
/* RIVALS */
.rival-card{background:var(--bg3);border:2px solid var(--bd);padding:5px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
/* IPO */
.ipo-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9998;display:none;align-items:center;justify-content:center;padding:10px;overflow-y:auto}
.ipo-overlay.on{display:flex}
.ipo-box{background:var(--bg2);border:3px solid #ffdd00;padding:14px;width:100%;max-width:380px}
.ipo-title{color:#ffdd00;font-size:12px;text-align:center;margin-bottom:6px}
.ipo-ticker{font-size:18px;color:#ffdd00;text-align:center;margin:8px 0;letter-spacing:3px}
.ipo-row{display:flex;justify-content:space-between;font-size:6px;padding:4px 0;border-bottom:1px solid var(--bd)}
.ipo-row:last-child{border-bottom:none}
.req-ok{color:var(--gn)}.req-no{color:var(--rd)}
.ipo-btn{font-family:'Press Start 2P',monospace;font-size:6px;padding:8px;cursor:pointer;border:2px solid;display:block;width:100%;margin-bottom:4px;-webkit-appearance:none}
/* NAME SCREEN */
.name-overlay{position:fixed;inset:0;background:var(--bg);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px}
.name-overlay.on{display:flex}
.name-box{background:var(--bg2);border:3px solid var(--ac);padding:20px;text-align:center;width:100%;max-width:320px}
.name-title{color:var(--ac);font-size:10px;margin-bottom:10px;line-height:1.5}
.name-sub{color:#666;font-size:5px;margin-bottom:14px;line-height:2}
.name-input{background:var(--bg3);border:2px solid var(--bd);color:var(--tx);font-family:'Press Start 2P',monospace;font-size:8px;padding:8px;width:100%;text-align:center;outline:none;margin-bottom:10px;-webkit-appearance:none}
.name-input:focus{border-color:var(--ac)}
.name-btn{font-family:'Press Start 2P',monospace;font-size:7px;padding:8px;cursor:pointer;border:2px solid var(--ac);background:var(--bg3);color:var(--ac);width:100%;-webkit-appearance:none}
.blink{animation:bk 1s step-end infinite}@keyframes bk{50%{opacity:0}}
</style>
</head>
<body>

<div id="notifs"></div>

<!-- NAME -->
<div class="name-overlay on" id="name-screen">
  <div class="name-box">
    <div class="name-title">NOVA STARTUP 🚀</div>
    <div class="name-sub">Qual o nome da sua empresa?</div>
    <input class="name-input" id="name-inp" maxlength="14" placeholder="Ex: Benete.inc">
    <button class="name-btn" id="name-btn">FUNDAR →</button>
  </div>
</div>

<!-- IPO -->
<div class="ipo-overlay" id="ipo-screen">
  <div class="ipo-box">
    <div class="ipo-title">📈 IPO NA NASDAQ</div>
    <div class="ipo-ticker" id="ipo-ticker">????</div>
    <div id="ipo-reqs"></div>
    <div id="ipo-result" style="display:none;color:var(--gn);font-size:5px;text-align:center;margin:8px 0;line-height:2"></div>
    <button class="ipo-btn" id="ipo-confirm" style="border-color:#ffdd00;background:#1a1a00;color:#ffdd00">ABRIR CAPITAL</button>
    <button class="ipo-btn" onclick="closeIPO()" style="border-color:var(--bd);background:none;color:#888">FECHAR</button>
  </div>
</div>

<div id="wrap"><div id="app"></div></div>

<script>
// ── UTILS ───────────────────────────────────────────────────────────
const fmt=n=>{if(n<0)return'-'+fmt(-n);if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n)+''};
const fmtT=s=>{s=Math.floor(Math.abs(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?h+'h'+m+'m':m>0?m+'m'+sc+'s':sc+'s'};
const el=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=el(id);if(e)e.addEventListener(ev,fn)};

// ── AUDIO ───────────────────────────────────────────────────────────
let actx=null;
const ga=()=>{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx};
const beep=(f,d,v=0.09,t='square')=>{try{const c=ga(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}};
const sfx={
  click:()=>beep(880,0.04,0.07),
  buy:()=>{beep(440,0.04,0.07);setTimeout(()=>beep(660,0.05,0.07),55);setTimeout(()=>beep(880,0.09,0.08),120)},
  good:()=>{beep(523,0.05,0.08,'triangle');setTimeout(()=>beep(784,0.1,0.08,'triangle'),80)},
  bad:()=>{beep(200,0.09,0.09,'sawtooth');setTimeout(()=>beep(150,0.14,0.09,'sawtooth'),100)},
  notify:()=>{beep(1047,0.04,0.06,'sine');setTimeout(()=>beep(1319,0.07,0.06,'sine'),65)},
  tech:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,0.07,0.09,'triangle'),i*65))},
  prestige:()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.09,0.1,'triangle'),i*70))},
  milestone:()=>{beep(660,0.05,0.09);setTimeout(()=>beep(880,0.05,0.09),55);setTimeout(()=>beep(1100,0.09,0.1),110)},
  boost:()=>{beep(660,0.04,0.08);setTimeout(()=>beep(1100,0.09,0.09),90)},
  promote:()=>{[330,440,550,660,880].forEach((f,i)=>setTimeout(()=>beep(f,0.06,0.09,'triangle'),i*50))},
  autoUpg:()=>{beep(440,0.04,0.09);setTimeout(()=>beep(660,0.09,0.1),100)},
  rival:()=>{beep(330,0.08,0.09,'sawtooth');setTimeout(()=>beep(220,0.12,0.09,'sawtooth'),100)},
  mission:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.08,0.09,'triangle'),i*60))},
  ipo:()=>{[523,659,784,1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>beep(f,0.12,0.12,'triangle'),i*80))},
};

// ── COMPANY ─────────────────────────────────────────────────────────
let cName=localStorage.getItem('b6n')||'';
let cTicker='';
function setName(n){cName=n.trim()||'Startup';cTicker=cName.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(0,4)||'CORP';localStorage.setItem('b6n',cName);}

// ── DEV RANKS ───────────────────────────────────────────────────────
const RANKS=[
  {id:'jr',label:'Junior',    badge:'JR',cls:'jr',emoji:['👦','👧'],      prod:1,  mult:1,  codC:0,   funC:0},
  {id:'pl',label:'Pleno',     badge:'PL',cls:'pl',emoji:['👨','👩'],      prod:2.2,mult:1.5,codC:300, funC:50},
  {id:'sr',label:'Senior',    badge:'SR',cls:'sr',emoji:['🧔','👩‍🦱'],  prod:4.5,mult:2.5,codC:800, funC:150},
  {id:'sp',label:'Especialista',badge:'SP',cls:'sp',emoji:['🧙‍♂️','🧙‍♀️'],prod:9,mult:5,  codC:2500,funC:500},
];
const DN=['Ana','Bruno','Carla','Diego','Elena','Felipe','Gabi','Hugo','Iris','Joao'];
const DS=['Silva','Costa','Lima','Souza','Ferreira'];
const DR={jr:['Dev Jr','Estagiario','Frontend Jr'],pl:['Dev Pleno','Full-Stack','DevOps'],sr:['Tech Lead','Dev Senior','Arquiteto'],sp:['Staff Eng','Distinguished','CTO Track']};
const DQ=['Odeia reunioes','Usa vim','Dark mode only','8 cafes/dia','Commita na main','Sem testes','PR as 23h','Reescreve em Rust'];
const DE=['👨‍💻','👩‍💻','🧑‍💻'];
function mkEmp(rank='jr'){const r=RANKS.find(x=>x.id===rank),g=Math.floor(Math.random()*2);return{name:DN[Math.floor(Math.random()*DN.length)]+' '+DS[Math.floor(Math.random()*DS.length)],rank,role:DR[rank][Math.floor(Math.random()*DR[rank].length)],mood:Math.floor(Math.random()*3),quirk:DQ[Math.floor(Math.random()*DQ.length)],prod:(r.prod*(0.85+Math.random()*0.3)).toFixed(1),emoji:r.emoji[g],g};}

// ── RIVALS ──────────────────────────────────────────────────────────
const RIVAL_DEF=[
  {name:'PixelStartup',logo:'🟣',spd:0.9,personality:'agressivo'},
  {name:'DevForge',    logo:'🔴',spd:0.75,personality:'consistente'},
  {name:'ByteRocket',  logo:'🟠',spd:0.6,personality:'explosivo'},
  {name:'TechStart',   logo:'🔵',spd:0.4,personality:'lento'},
];
let rivals=[];
function initRivals(){rivals=RIVAL_DEF.map(r=>({...r,fund:Math.random()*50,rep:Math.random()*10,val:0,ahead:false,burst:0}));}
function tickRivals(dt){
  rivals.forEach(r=>{
    const base=(G.fundRate||0.05)*r.spd*(0.7+Math.random()*0.6);
    if(r.personality==='explosivo'&&Math.random()<0.002*dt)r.burst=20;
    r.burst=Math.max(0,r.burst-dt);
    r.fund+=base*(r.burst>0?3:1)*dt;
    r.rep+=G.repRate*r.spd*0.4*dt;
    r.val=r.fund*10+r.rep*80;
    const wasAhead=r.ahead;
    r.ahead=r.val>(G.totalFund*10+G.rep*80);
    if(r.ahead&&!wasAhead&&G.totalFund>500){addLog(r.name+' ultrapassou '+cName+'!','b');notify('⚠ '+r.name+' te ultrapassou!','rival');sfx.rival();}
    else if(!r.ahead&&wasAhead&&G.totalFund>500){addLog(cName+' ultrapassou '+r.name+'!','g');notify('🎉 Ultrapassou '+r.name,'boost');sfx.good();}
  });
}

// ── MISSIONS ────────────────────────────────────────────────────────
const MIS_POOL=[
  {id:'c50',   title:'Cliqueiro',   desc:'Clique 50x',              type:'clicks',   tgt:50,   rwd:{t:'fund',v:500},   rl:'+$500'},
  {id:'c200',  title:'Digitador',   desc:'Clique 200x',             type:'clicks',   tgt:200,  rwd:{t:'fund',v:2000},  rl:'+$2K'},
  {id:'f1k',   title:'Seed!',       desc:'Acumule $1K funding',     type:'totalFund',tgt:1000, rwd:{t:'rep',v:100},    rl:'+100 rep'},
  {id:'r100',  title:'Influencer',  desc:'Alcance 100 reputacao',   type:'rep',      tgt:100,  rwd:{t:'code',v:500},   rl:'+500 cod'},
  {id:'d3',    title:'Fundadores',  desc:'Tenha 3 devs',            type:'devs',     tgt:3,    rwd:{t:'fund',v:800},   rl:'+$800'},
  {id:'d5',    title:'Time solido', desc:'Tenha 5 devs',            type:'devs',     tgt:5,    rwd:{t:'boost',v:30},   rl:'Boost 30s'},
  {id:'s1',    title:'Online!',     desc:'Compre 1 servidor',       type:'servers',  tgt:1,    rwd:{t:'rep',v:200},    rl:'+200 rep'},
  {id:'p1',    title:'Lancamento!', desc:'Lance 1 produto',         type:'prods',    tgt:1,    rwd:{t:'fund',v:3000},  rl:'+$3K'},
  {id:'ev3',   title:'Resiliente',  desc:'Sobreviva 3 eventos',     type:'evSurv',   tgt:3,    rwd:{t:'fund',v:1500},  rl:'+$1.5K'},

let misTimer=300;
function genMissions(){
  const pool=[...MIS_POOL];const out=[];
  for(let i=0;i<3&&pool.length;i++){const idx=Math.floor(Math.random()*pool.length);out.push({...pool[idx],prog:0,done:false,claimed:false});pool.splice(idx,1);}
  missions=out;misTimer=300;
  mp={clicks:0,totalFund:0,rep:0,devs:0,servers:0,prods:0,evSurv:0,pitches:0,rankPl:0,techs:0,coffees:0};
}
function tickMissions(){
  mp.totalFund=G.totalFund;mp.rep=G.rep;mp.devs=G.devs;mp.servers=G.servers;mp.prods=products.length;
  mp.techs=Object.keys(techDone).length;
  mp.rankPl=employees.filter(e=>['pl','sr','sp'].includes(e.rank)).length;
  missions.forEach(m=>{
    if(m.done)return;
    m.prog=Math.min(mp[m.type]||0,m.tgt);
    if(m.prog>=m.tgt){m.done=true;addLog('MISSAO: '+m.title+'!','g');notify('✓ '+m.title,'mission');sfx.mission();}
  });
}
function claimMission(i){
  const m=missions[i];if(!m||!m.done||m.claimed)return;
  m.claimed=true;
  const r=m.rwd,mult=G.prestigeMult;
  if(r.t==='fund'){G.fund+=r.v*mult;G.totalFund+=r.v*mult;}
  else if(r.t==='rep')G.rep+=r.v*mult;
  else if(r.t==='code')G.code+=r.v*mult;
  else if(r.t==='boost'){G.boostActive=true;G.boostMult=2;G.boostTime=r.v;G.boostMax=r.v;}
  addLog('Recompensa: '+m.rl,'g');sfx.buy();render();
}

// ── SHOP LOGIC ───────────────────────────────────────────────────────
function canAfford(u){
  if(u.count>=(u.max||1))return false;
  const c=u.cost;
  if(u.t==='code')return G.code>=c.code;
  if(u.t==='fund')return G.fund>=c.fund;
  if(u.t==='rep') return G.rep>=c.rep;
  if(u.t==='both')return G.code>=c.code&&G.fund>=c.fund;
  if(u.t==='bf')  return G.fund>=c.fund&&G.rep>=c.rep;
  if(u.t==='rf')  return G.rep>=c.rep&&G.fund>=c.fund;
  return false;
}
function costStr(u){
  const c=u.cost;
  if(u.t==='code')return fmt(c.code)+' cod';
  if(u.t==='fund')return '$'+fmt(c.fund);
  if(u.t==='rep') return fmt(c.rep)+' rep';
  if(u.t==='both')return fmt(c.code)+' cod+$'+fmt(c.fund);
  if(u.t==='bf')  return '$'+fmt(c.fund)+'+'+fmt(c.rep)+' rep';
  if(u.t==='rf')  return fmt(c.rep)+' rep+$'+fmt(c.fund);
  return '';
}
function buy(i){
  const u=shop[i];if(!canAfford(u))return;
  const c=u.cost,sc=u.count<5?1.45:1.7;
  if(u.t==='code'){G.code-=c.code;u.cost.code=Math.ceil(c.code*sc);}
  if(u.t==='fund'){G.fund-=c.fund;u.cost.fund=Math.ceil(c.fund*sc);}
  if(u.t==='rep') {G.rep-=c.rep;u.cost.rep=Math.ceil(c.rep*sc);}
  if(u.t==='both'){G.code-=c.code;G.fund-=c.fund;u.cost.code=Math.ceil(c.code*sc);u.cost.fund=Math.ceil(c.fund*sc);}
  if(u.t==='bf')  {G.fund-=c.fund;G.rep-=c.rep;u.cost.fund=Math.ceil(c.fund*sc);u.cost.rep=Math.ceil(c.rep*sc);}
  if(u.t==='rf')  {G.rep-=c.rep;G.fund-=c.fund;u.cost.rep=Math.ceil(c.rep*sc);u.cost.fund=Math.ceil(c.fund*sc);}
  u.count++;applyBuy(u.id);sfx.buy();addLog('Comprado: '+u.name,'g');render();
}
function promoteEmp(fromRank,toRank){
  const idx=employees.findIndex(e=>e.rank===fromRank);
  if(idx<0){addLog('Sem '+fromRank+' para promover','w');return false;}
  const e=employees[idx],r=RANKS.find(x=>x.id===toRank);
  e.rank=toRank;e.role=DR[toRank][Math.floor(Math.random()*DR[toRank].length)];
  e.prod=(r.prod*(0.85+Math.random()*0.3)).toFixed(1);e.emoji=r.emoji[e.g||0];
  addLog(e.name+' virou '+r.label+'!','g');sfx.promote();
  notify('📈 '+e.name+' → '+r.label,'boost');
  mp.rankPl++;return true;
}

// ── CALC RATES ───────────────────────────────────────────────────────
function calcRates(){
  const tm=TM();
  const srvM=(1+G.servers*0.4)*G.cdnBonus*tm.srvMult;
  const bcM=(G.bootcamp?1.3:1)*(G.pairProg?1.2:1);
  const filM=G.filial?2:1;
  const bstM=G.boostActive?G.boostMult:1;
  const crM=(G.crunchMode&&G.crunchTimer>0)?2:1;
  const morM=G.moraleHigh?1.25:G.moraleLow?0.75:1;
  const cofM=G.coffee>0?1.3:0.65;
  const empP=employees.reduce((a,e)=>{const r=RANKS.find(x=>x.id===e.rank);return a+(r?r.mult*parseFloat(e.prod):1);},0);
  const hackM=G.hackday?1+(employees.length*0.02):1;
  G.codeRate=empP*bcM*srvM*filM*G.prestigeMult*bstM*cofM*tm.codeBonus*crM*morM*hackM;
  const pRepR=products.reduce((a,p)=>a+p.repR*tm.prodRep,0)*G.appStoreBonus;
  G.repRate=(G.devs*0.15+pRepR+(G.osBonus||0)+(G.brandBonus||0))*filM*G.prestigeMult*bstM*(G.prFirm?1.4:1)*(G.mediaBlackout?0:1);
  const pFR=products.reduce((a,p)=>a+p.fundR,0)+(G.b2bBonus||0)*products.length;
  G.fundRate=(G.rep*0.04*(G.analytics?2:1)+pFR)*filM*G.prestigeMult*bstM*tm.fundMult*(G.legal?1.3:1);
  // IPO dividends
  if(ipoDone&&divTimer<=0){const d=sharePrice*1e8*0.0001*G.prestigeMult;G.fund+=d;G.totalFund+=d;divTimer=60;addLog('Dividendos IPO: +$'+fmt(d),'p');}
}

// ── TICK ─────────────────────────────────────────────────────────────
let tickN=0;
function tick(){
  const now=Date.now(),dt=Math.min((now-lastTick)/1000,0.5);lastTick=now;tickN++;
  calcRates();
  if(eventPause>0)eventPause=Math.max(0,eventPause-dt);
  else{
    G.code+=G.codeRate*dt;
    const fg=G.fundRate*dt;G.fund+=fg;G.totalFund+=fg;
    if(!G.mediaBlackout)G.rep+=G.repRate*dt;
  }
  const drain=1.1*(G.coffeeDrain||1)*((G.crunchMode&&G.crunchTimer>0)?3:1);
  G.coffee=Math.max(G.coffeeMin||0,G.coffee-drain*dt);
  launchCD=Math.max(0,launchCD-dt);
  // auto clicker
  if(G.autoLvl>0){
    autoTimer+=dt;
    const spd=[0,1,2,5,10,20][G.autoLvl]*(techDone['aicp']?TM().aiBonus:1);
    if(autoTimer>=1/spd){autoTimer=0;const pw=G.clickPow*G.prestigeMult*(G.coffee>0?1.2:0.65)*(G.boostActive?G.boostMult:1)*0.75;G.code+=pw;G.totalClicks++;mp.clicks++;flashWin();}
  }
  if(G.boostActive){G.boostTime-=dt;if(G.boostTime<=0){G.boostActive=false;G.boostMult=1;addLog('Boost acabou','w');}}
  if(G.crunchMode&&G.crunchTimer>0){G.crunchTimer-=dt;if(G.crunchTimer<=0){G.crunchMode=false;addLog('Crunch acabou','w');}}
  if((G.moraleHigh||G.moraleLow)&&G.moraleTimer>0){G.moraleTimer-=dt;if(G.moraleTimer<=0){G.moraleHigh=false;G.moraleLow=false;}}
  if(G.mediaBlackout&&G.mediaTimer>0){G.mediaTimer-=dt;if(G.mediaTimer<=0)G.mediaBlackout=false;}
  if(G.milestoneTimer>0){G.milestoneTimer-=dt;if(G.milestoneTimer<=0)G.milestone=null;}
  if(miniEv&&meTimer>0){meTimer-=dt;if(meTimer<=0){miniEv.opts[miniEv.opts.length-1].fn();miniEv=null;meTimer=0;addLog('Evento expirou!','b');sfx.bad();render();}}
  const tm=TM();
  products.forEach(p=>{p.age+=dt;p.users=Math.min(p.maxU,p.users+dt*4*tm.userGrowth*G.appStoreBonus);});
  tickRivals(dt);
  misTimer-=dt;if(misTimer<=0)genMissions();
  tickMissions();
  if(ipoDone&&divTimer>0)divTimer-=dt;
  eventTimer-=dt;
  if(eventTimer<=0&&!miniEv){
    eventTimer=20+Math.random()*20;G.eventsCount++;
    if(Math.random()<0.35)triggerMiniEv();
    else{const ev=REG_EV[Math.floor(Math.random()*REG_EV.length)];if(ev.t==='b'&&G.security&&Math.random()<0.55)addLog('Seguranca bloqueou!','i');else{ev.fn();addLog(ev.msg,ev.t);if(ev.t==='b')sfx.bad();else if(ev.t==='g')sfx.good();}}
  }
  while(employees.length<Math.min(G.devs,25))employees.push(mkEmp('jr'));
  while(employees.length>G.devs)employees.pop();
  saveTimer+=dt;if(saveTimer>20){saveTimer=0;save();}
  checkAchs();checkMS();checkIPO();
  if(tickN%3===0)render();
  requestAnimationFrame(tick);
}

    <div class="me-timer" style="color:${meTimer<8?'var(--rd)':'var(--yw)'}">⏱ ${Math.ceil(meTimer)}s</div>

  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--bd);padding-bottom:5px;margin-bottom:6px">
    <span style="color:#554499;font-size:5px">${G.prestigeCount>0?'★ x'+G.prestigeCount+' '+G.prestigeMult.toFixed(0)+'x':''}</span>
    <span style="color:var(--ac);font-size:10px">${cName.toUpperCase()}</span>
    <div style="display:flex;gap:4px;align-items:center">
      ${ipoUnlocked&&!ipoDone?`<button onclick="openIPO()" style="background:#1a1a00;border:1px solid #ffdd00;color:#ffdd00;font-family:'Press Start 2P',monospace;font-size:5px;padding:2px 5px;cursor:pointer">IPO</button>`:''}
      ${ipoDone?`<span style="color:#ffdd00;font-size:5px">📈${cTicker}</span>`:''}

  ${G.milestone?`<div class="milestone">★ ${G.milestone}</div>`:''}
  ${G.boostActive?`<div class="boost-bar"><div style="display:flex;justify-content:space-between;font-size:5px;margin-bottom:2px"><span style="color:var(--gn)">${G.boostMult}x BOOST</span><span style="color:var(--gn)">${Math.ceil(G.boostTime)}s</span></div><div class="bfill" style="width:${(G.boostTime/G.boostMax*100).toFixed(1)}%"></div></div>`:''}

  <div class="topbar">
    <div class="rc"><div class="rl">CODIGO</div><div class="rv">${fmt(G.code)}</div><div class="rr">+${fmt(G.codeRate)}/s</div></div>
    <div class="rc"><div class="rl">REP</div><div class="rv">${fmt(G.rep)}</div><div class="rr">${G.mediaBlackout?'BLACKOUT':'+'+fmt(G.repRate)+'/s'}</div></div>
    <div class="rc"><div class="rl">FUND</div><div class="rv">$${fmt(G.fund)}</div><div class="rr">+$${fmt(G.fundRate)}/s</div></div>
    <div class="rc"><div class="rl">CAFE</div><div class="coffbar"><div class="coffill" style="width:${G.coffee.toFixed(0)}%"></div></div><div class="rr">${G.coffee>0?Math.floor(G.coffee)+'%':'VAZIO!'}</div></div>
    <div class="rc"><div class="rl">VALUATION</div><div class="rv">$${fmt(G.totalFund*10)}</div><div class="rr">${pct.toFixed(1)}% meta</div></div>
  </div>

  <div class="layout">
    <!-- LEFT -->
    <div>
      <div class="panel" style="margin-bottom:5px;text-align:center">
        <div class="ptitle">HQ</div>
        <div class="cw" id="cw">
          <svg id="bld" width="88" height="88" viewBox="0 0 32 32" style="cursor:pointer;display:block;margin:0 auto 3px;touch-action:manipulation">
            <rect x="2" y="13" width="28" height="17" fill="#1a1a3a"/>
            <rect x="4" y="11" width="24" height="4" fill="#22224a"/>
            <rect x="7" y="5" width="18" height="8" fill="#1a1a3a"/>
            <rect x="9" y="3" width="14" height="4" fill="#22224a"/>
            <rect x="13" y="1" width="6" height="4" fill="#8888ff"/>
            <rect x="4"  y="15" width="5" height="4" fill="#2a2a6a" id="w1"/>
            <rect x="11" y="15" width="5" height="4" fill="#2a2a6a" id="w2"/>
            <rect x="18" y="15" width="5" height="4" fill="#2a2a6a" id="w3"/>
            <rect x="25" y="15" width="5" height="4" fill="#2a2a6a" id="w4"/>
            <rect x="4"  y="21" width="5" height="4" fill="#2a2a6a" id="w5"/>
            <rect x="11" y="21" width="5" height="4" fill="#2a2a6a" id="w6"/>
            <rect x="18" y="21" width="5" height="4" fill="#2a2a6a" id="w7"/>
            <rect x="25" y="21" width="5" height="4" fill="#2a2a6a" id="w8"/>
            <rect x="13" y="23" width="6" height="7" fill="#0a0a1a"/>
          </svg>
        </div>
        <div style="font-size:5px;color:var(--ac);margin-bottom:2px">+${fmt(pw)}/click</div>
        <div style="font-size:5px;color:var(--cy)">AUTO: ${autoSpds[G.autoLvl]}x/s</div>
        <div class="autolvl">${[1,2,3,4,5].map(l=>`<div class="alvl${G.autoLvl>=l?' on':''}">${l}</div>`).join('')}</div>
        <div style="margin-top:4px">
          ${rankCount.map(r=>`<div class="sr"><span style="color:${r.id==='jr'?'#7777cc':r.id==='pl'?'var(--gn)':r.id==='sr'?'var(--yw)':'var(--pk)'}">${r.badge}</span><span>${r.n}</span></div>`).join('')}
          <div class="sr"><span>SERVIDORES</span><span>${G.servers}${G.serverUnstable?'⚠':''}</span></div>
          <div class="sr"><span>PRODUTOS</span><span>${products.length}</span></div>
          <div class="sr"><span>MULT</span><span>${G.prestigeMult.toFixed(0)}x</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="ptitle">CONQUISTAS</div>
        <div>${ACHS.map(a=>`<span class="abadge${achDone[a.id]?' done':''}" title="${a.name}">${a.icon}</span>`).join('')}</div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="panel">
      <div class="tabs">
        <button class="tab${tab==='shop'?' on':''}" data-tab="shop">UPG</button>
        <button class="tab${tab==='tech'?' on':''}" data-tab="tech">TECH</button>
        <button class="tab${tab==='team'?' on':''}" data-tab="team">TIME</button>
        <button class="tab${tab==='prods'?' on':''}" data-tab="prods">PROD</button>
        <button class="tab${tab==='missions'?' on':''}" data-tab="missions">MISS</button>
        <button class="tab${tab==='stats'?' on':''}" data-tab="stats">STATS</button>
      </div>

      ${tab==='shop'?`
        <div class="tabs" style="border-bottom:1px solid var(--bd);margin-bottom:4px">
          ${cats.map(c=>`<button class="tab${catFilter===c.id?' on':''}" data-cat="${c.id}">${c.l}</button>`).join('')}
        </div>
        <div class="scroll">${filtShop.map(({u,i})=>{
          const owned=u.count>=(u.max||1)&&u.max<99;
          const cnt=u.max>1&&u.count>0?' x'+u.count:'';
          return`<button class="upg cat-${u.cat}${owned?' owned':''}"${(!canAfford(u)&&!owned)||owned?' disabled':''} data-buy="${i}"><span class="un">${u.icon} ${u.name}${cnt}${owned?' ✓':''}</span><span class="ud">${u.desc}</span>${!owned?`<span class="uc">${costStr(u)}</span>`:''}</button>`;
        }).join('')}</div>`:''}

      ${tab==='tech'?`<div class="scroll">${techHTML}</div>`:''}

      ${tab==='team'?`<div class="scroll">
        <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px">
          ${rankCount.map(r=>`<div style="background:var(--bg3);border:1px solid var(--bd);padding:3px;text-align:center;flex:1"><div style="font-size:10px">${r.emoji[0]}</div><div class="rank-badge rank-${r.id}">${r.badge}</div><div style="font-size:4px;color:var(--ac)">${r.n} | ${r.mult}x</div></div>`).join('')}
        </div>
        ${employees.length===0?'<div style="color:#333355;font-size:5px">Contrate devs!</div>':employees.map(e=>`<div class="dev-card"><div class="dev-av ${e.rank}">${e.emoji}</div><div style="flex:1;min-width:0"><div style="font-size:5px"><span class="rank-badge rank-${e.rank}">${RANKS.find(r=>r.id===e.rank).badge}</span>${e.name}</div><div style="color:#404060;font-size:4px">${e.role}</div><div style="color:var(--gn);font-size:4px">${['😄','😊','😐','😩','☕'][e.mood]} | ${e.quirk}</div></div></div>`).join('')}
      </div>`:''}

      ${tab==='prods'?`<div class="scroll">
        ${products.length===0?'<div style="color:#333355;font-size:5px;padding:5px">Nenhum produto ainda.</div>':products.map(p=>`<div class="prod-c"><div style="color:#aaaaee;font-size:6px">${p.icon} ${p.name}</div><div style="color:#404060;font-size:5px">${p.type} | ${fmtT(p.age)}</div><div class="pmet"><div class="pfill" style="width:${(p.users/p.maxU*100).toFixed(1)}%"></div></div><div style="display:flex;justify-content:space-between;font-size:5px;color:#445"><span>${fmt(p.users)} users</span><span>+${p.repR} rep/s | +$${p.fundR}/s</span></div></div>`).join('')}
        <div style="margin-top:5px;color:var(--ac);font-size:5px;margin-bottom:3px">LANCAR:</div>
        ${PTYPES.map((pt,i)=>{const cd=launchCD*tm.launchCD;const can=G.code>=pt.codC&&G.fund>=pt.funC&&G.devs>=pt.devN&&cd<=0;return`<button class="upg cat-prod"${!can?' disabled':''} data-launch="${i}"><span class="un">${pt.icon} ${pt.type}</span><span class="ud">${pt.desc}</span><span class="uc">${fmt(pt.codC)} cod+$${fmt(pt.funC)}+${pt.devN} devs${cd>0?' cd '+Math.ceil(cd)+'s':''}</span></button>`;}).join('')}
      </div>`:''}

      ${tab==='missions'?`<div>
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:5px;color:var(--cy)">MISSOES DA SESSAO</span>
          <span style="font-size:5px;color:${misTimer<60?'var(--rd)':'#444466'}">reset:${fmtT(misTimer)}</span>
        </div>
        ${missions.map((m,i)=>`<div class="mission-card${m.done?' done':''}">
          <div class="mission-title">${m.title}${m.claimed?' ✓':''}</div>
          <div class="mission-desc">${m.desc}</div>
          <div class="mission-prog"><div class="mission-fill" style="width:${Math.min(100,(m.prog/m.tgt)*100).toFixed(1)}%"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="mission-reward">🎁 ${m.rl}</span>
            <span style="font-size:5px;color:#444466">${fmt(m.prog)}/${fmt(m.tgt)}</span>
          </div>
          ${m.done&&!m.claimed?`<button style="margin-top:4px;width:100%;background:var(--gn);border:none;color:var(--bg);font-family:'Press Start 2P',monospace;font-size:5px;padding:4px;cursor:pointer" data-claim="${i}">COLETAR</button>`:''}
        </div>`).join('')}
      </div>`:''}

      ${tab==='stats'?`<div style="font-size:5px">
        ${[['Empresa',cName],['Ticker',cTicker||'--'],['Clicks',fmt(G.totalClicks)],['Total fund','$'+fmt(G.totalFund)],['Prestige',G.prestigeCount],['Mult',G.prestigeMult.toFixed(0)+'x'],['Devs',G.devs],['JR/PL/SR/SP',rankCount.map(r=>r.n).join('/')],['Serv.',G.servers],['Prods',products.length],['Techs',Object.keys(techDone).length+'/9'],['Auto',autoSpds[G.autoLvl]+'x/s'],['Cod/s',fmt(G.codeRate)],['Fund/s','$'+fmt(G.fundRate)],['IPO',ipoDone?cTicker+' $'+sharePrice.toFixed(2):'nao'],['Tempo',fmtT((Date.now()-G.runStart)/1000)]].map(r=>`<div class="sr" style="margin-bottom:2px"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}
        ${runHistory.length?`<div style="color:var(--ac);font-size:5px;margin:4px 0 3px">RUNS</div>${runHistory.map((r,i)=>`<div class="sr"><span>#${i+1} ${fmtT(r.time)}</span><span>$${fmt(r.fund)} ${r.mult.toFixed(0)}x</span></div>`).join('')}`:''}
      </div>`:''}
    </div>

    <!-- RIGHT -->
    <div>
      <div class="panel" style="margin-bottom:5px">
        <div class="ptitle">META $${fmt(goal)}</div>
        <div class="pbar-o"><div class="pbar-i" style="width:${pct.toFixed(3)}%"></div></div>
        <div style="font-size:5px;color:#333355;margin-bottom:3px">$${fmt(G.totalFund)} / $${fmt(goal)}</div>
        <button class="pbtn" ${!(prestigeUnlocked&&G.totalFund>=goal)?'disabled':''} id="pbtn">
          ${prestigeUnlocked&&G.totalFund>=goal?'>>> UNICORNIO! <<<':prestigeUnlocked?'ACUMULE $'+fmt(goal):'COMPRE PRESTIGE'}
        </button>
      </div>
      <div class="panel" style="margin-bottom:5px">
        <div class="ptitle">RANKING</div>
        ${rivalsSorted.map((r,i)=>`<div class="rival-card" style="border-color:${r.you?'var(--gn)':r.ahead?'var(--rd)':'#222244'}"><span style="font-size:13px">${r.logo}</span><div style="flex:1;min-width:0"><div style="font-size:5px;color:${r.you?'var(--gn)':r.ahead?'var(--rd)':'#555588'}">#${i+1} ${r.name}</div><div style="font-size:5px;color:${r.you?'var(--yw)':'#444466'}">$${fmt(r.val)}</div></div>${!r.you?`<span style="font-size:6px;color:${r.ahead?'var(--rd)':'var(--gn)'}">${r.ahead?'▲':'▼'}</span>`:''}</div>`).join('')}
      </div>
      ${ipoUnlocked?`<div class="panel">
        <div class="ptitle">IPO</div>
        ${ipoDone?`<div style="color:#ffdd00;font-size:5px;text-align:center">📈 NA BOLSA!</div><div class="sr"><span>Ticker</span><span style="color:#ffdd00">${cTicker}</span></div><div class="sr"><span>Share</span><span style="color:var(--gn)">$${sharePrice.toFixed(2)}</span></div><div class="sr"><span>Dividendo em</span><span>${Math.ceil(Math.max(0,divTimer))}s</span></div>`
        :`<div style="font-size:5px;color:#888;margin-bottom:4px">Requisitos:</div>
        <div class="sr" style="border-color:${G.totalFund*10>=1e10?'var(--gn)':'var(--bd)'}"><span>Valuation $10B</span><span style="color:${G.totalFund*10>=1e10?'var(--gn)':'var(--rd)'}">${G.totalFund*10>=1e10?'✓':'$'+fmt(G.totalFund*10)}</span></div>
        <div class="sr" style="border-color:${G.rep>=10000?'var(--gn)':'var(--bd)'}"><span>Rep 10K</span><span style="color:${G.rep>=10000?'var(--gn)':'var(--rd)'}">${G.rep>=10000?'✓':fmt(G.rep)}</span></div>
        <div class="sr" style="border-color:${products.length>=3?'var(--gn)':'var(--bd)'}"><span>3 produtos</span><span style="color:${products.length>=3?'var(--gn)':'var(--rd)'}">${products.length>=3?'✓':products.length+'/3'}</span></div>
        <div class="sr" style="border-color:${G.totalPrestige>=1?'var(--gn)':'var(--bd)'}"><span>1 Prestige</span><span style="color:${G.totalPrestige>=1?'var(--gn)':'var(--rd)'}">${G.totalPrestige>=1?'✓':'0/1'}</span></div>
        <button class="pbtn" style="margin-top:4px" onclick="openIPO()">VER IPO</button>`}
      </div>`:''}
    </div>
  </div>

  <div class="log-a">
    <div style="color:#333355;font-size:5px;margin-bottom:2px">${cName} LOG <span class="blink">_</span></div>
    ${logs.slice(0,20).map(m=>`<div class="lm ${m.t}">> ${m.msg}</div>`).join('')}
  </div>`;

  // Event delegation — works on both touch and click
  app.querySelectorAll('[data-buy]').forEach(b=>{b.addEventListener('click',()=>buy(+b.dataset.buy),{passive:false});});
  app.querySelectorAll('[data-launch]').forEach(b=>{b.addEventListener('click',()=>launchProd(+b.dataset.launch));});
  app.querySelectorAll('[data-me]').forEach(b=>{b.addEventListener('click',()=>resolveME(+b.dataset.me));});
  app.querySelectorAll('[data-tab]').forEach(b=>{b.addEventListener('click',()=>{tab=b.dataset.tab;render();});});
  app.querySelectorAll('[data-cat]').forEach(b=>{b.addEventListener('click',()=>{catFilter=b.dataset.cat;render();});});
  app.querySelectorAll('[data-tech]').forEach(b=>{b.addEventListener('click',()=>research(b.dataset.tech));});
  app.querySelectorAll('[data-claim]').forEach(b=>{b.addEventListener('click',()=>claimMission(+b.dataset.claim));});
  const bld=document.getElementById('bld');
  if(bld){bld.addEventListener('click',doClick);bld.addEventListener('touchend',e=>{e.preventDefault();doClick(e.changedTouches[0]);},{passive:false});}
  const pbtn=el('pbtn');if(pbtn)pbtn.addEventListener('click',doPrestige);
}

// ── BOOT ─────────────────────────────────────────────────────────────
function boot(){
  initRivals();genMissions();
  const loaded=load();
  lastTick=Date.now();
  addLog(loaded?cName+' v6 restaurado!':cName+' fundada! Bora codar.',loaded?'g':'i');
  if(!loaded)addLog('DICA: cafe + devs primeiro!','w');
  render();tick();
}

// Name screen
on('name-btn','click',()=>{
  const v=el('name-inp').value.trim();
  if(!v){el('name-inp').style.borderColor='var(--rd)';return;}
  setName(v);el('name-screen').classList.remove('on');boot();
});
on('name-inp','keydown',e=>{if(e.key==='Enter')el('name-btn').click();});
on('name-inp','touchend',e=>{e.stopPropagation();});

if(cName){el('name-screen').classList.remove('on');boot();}
window.addEventListener('beforeunload',save);
</script>
